name: My First Workflow
on:
  push:
  workflow_dispatch:

jobs:
  run-shell-commands:
    runs-on: ubuntu-latest
    steps:
      - name: echo a string
        run: echo "Hello World"

      - name: Multiline command
        run: |
          node -v
          npm -v
  run-build:
    runs-on: ubuntu-latest
    steps:
      - name: prallel job demo
        run: |
          echo "This is a parallel job"
          echo "Running in parallel with other jobs"
          hello
