name: My First Workflow
on:
  push:
  workflow_dispatch:
  label:
    types: [created, deleted]
jobs:
  run-shell-commands:
    runs-on: ubuntu-latest
    steps:
      - name: echo a string
        run: echo "Hello World"

      - name: Multiline command
        run: |
          node -v
          npm -v
  run-build:
    runs-on: ubuntu-latest
    steps:
      - name: parallel job demo
        run: |
          echo "This is a parallel job"
          echo "Running in parallel with other jobs"
          echo ${{ github.event_name }}
          echo ${{ github.event.action }}
          echo ${{ github.event.label.name }}
          echo ${{secrets.TEST_SECRET}}
          echo "Virtual Users: ${{ vars.VU_USERS || 'not set' }}"
      - name: Check repository secret
        env:
          MY_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is set"
          else
            echo "Secret is missing"
            exit 1
          fi  
