name: Reusable Greeting

on:
  workflow_call:
    inputs:
      name:
        description: Name to greet
        required: true
        type: string

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Greet the caller
        env:
          GREETING_NAME: ${{ inputs.name }}
        run: echo "Hello, ${GREETING_NAME}! This message came from a reusable workflow."
